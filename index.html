<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مخزن ورشة آل هاشم</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--dark:#111827;--dark2:#374151;--bg:#F3F4F6;--card:#FFFFFF;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--green:#059669;--green-d:#047857;--red:#DC2626;--amber:#D97706;--blue:#2563EB;--indigo:#4F46E5;--radius:16px;--accent:#4F46E5;--accent2:#6366F1;--grad:linear-gradient(135deg,#4F46E5,#7C3AED);--sh-raised:0 1px 3px rgba(17,24,39,.08),0 4px 12px rgba(17,24,39,.05);--sh-sm:0 1px 2px rgba(17,24,39,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:88px}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
/* ===== Header ===== */
header{position:sticky;top:0;z-index:40;background:var(--grad);color:#fff;padding:12px 14px 11px;box-shadow:0 2px 12px rgba(79,70,229,.35)}
.hd-row{display:flex;align-items:center;gap:10px}
.hd-title{flex:1;min-width:0}
.hd-title h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{font-size:12px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);display:inline-block;flex:none}
.dot.on{background:#34D399}.dot.off{background:#F87171}
.icon-btn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:21px;line-height:1;flex:none}
.icon-btn:active{background:rgba(255,255,255,.28)}
/* ===== Layout ===== */
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.card h2{font-size:17px;margin-bottom:8px}
.muted{color:var(--muted);font-size:13.5px}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px;text-align:center;box-shadow:var(--sh-sm)}
.stat .v{font-size:21px;font-weight:800;line-height:1.3}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.warn .v{color:var(--amber)}.stat.bad .v{color:var(--red)}.stat.good .v{color:var(--green)}
.section-title{font-size:16px;font-weight:800;margin:18px 2px 8px}
/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15.5px;min-height:48px}
.btn-pri{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}.btn-pri:active{background:#4338CA}
.btn-dark{background:var(--dark);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:#FEE2E2;color:var(--red)}
.btn-danger-solid{background:var(--red);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;min-height:40px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.55}
.fab{position:fixed;left:16px;bottom:96px;z-index:35;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:13px 20px;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(79,70,229,.4)}
/* ===== Forms ===== */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
label:first-child{margin-top:0}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=url],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);min-height:48px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input[readonly]{background:#F3F4F6;color:var(--muted)}
textarea{resize:vertical;min-height:64px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;min-height:40px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.warn.on{background:#D97706;border-color:#D97706;color:#fff}
.chip-x{border:0;background:none;color:var(--red);font-weight:800;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}
/* ===== مربعات اختيار اللون ===== */
.color-tiles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.color-tile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:700;min-height:48px;min-width:64px;text-align:center}
.color-tile .ct-stock{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.color-tile.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.color-tile.on .ct-stock{color:#E0E7FF}
.color-tile-add{border:2px dashed #C7D2FE;color:var(--accent);background:#EEF2FF}
.newcolor-row{display:flex;gap:8px;margin:6px 0}
.newcolor-row input{flex:1;min-width:0}
/* ===== قائمة اختيار الموديل بالصور ===== */
.picker-wrap{position:relative}
.picker-wrap input[type=text]{padding-left:48px}
.picker-btn{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:#EEF2FF;border-radius:50%;font-size:14px;line-height:1;color:var(--accent)}
.picker-panel{position:absolute;right:0;left:0;top:calc(100% + 4px);z-index:45;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 28px rgba(17,24,39,.16);max-height:272px;overflow-y:auto}
.picker-row{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer}
.picker-row:active{background:#F3F4F6}
.picker-row img{width:44px;height:44px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--line)}
.picker-noimg{width:44px;height:44px;flex:none;border:1px dashed #D1D5DB;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;text-align:center;color:var(--muted);background:#F9FAFB}
.picker-name{flex:1;min-width:0;font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-price{white-space:nowrap}
.picker-empty{padding:14px;text-align:center;color:var(--muted);font-size:14px}
/* ===== Lists ===== */
.item-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;box-shadow:var(--sh-sm)}
.item-card:active{background:#F9FAFB}
/* قائمة تجهيز الأوردر من المخزن — صف يُعلَّم لما يتجهز */
.pick-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.pick-row input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.pick-row.picked{opacity:.45}
.pick-row.picked .pick-name{text-decoration:line-through}
.pick-row.short{border-color:#DC2626;background:#FEF2F2}
.pick-thumb{width:56px;height:56px;flex:none;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pick-thumb-ph{display:flex;align-items:center;justify-content:center;font-size:26px;background:#F1F5F9}
.stk{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.stk span{font-size:13.5px}
.stk b{font-size:14px}
.warn{color:#DC2626;font-weight:800}
.item-name{font-weight:800;font-size:16.5px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-green{background:#D1FAE5;color:#065F46}.b-amber{background:#FEF3C7;color:#92400E}.b-red{background:#FEE2E2;color:#991B1B}
.b-blue{background:#DBEAFE;color:#1E40AF}.b-indigo{background:#E0E7FF;color:#3730A3}.b-slate{background:#E5E7EB;color:#374151}
.badge-lg{font-size:13.5px;padding:5px 12px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:6px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px;min-height:44px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini th,table.mini td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.mini th{color:var(--muted);font-size:12.5px}
/* ===== Bottom nav ===== */
nav{position:fixed;right:0;left:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 12px rgba(17,24,39,.06);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 2px 9px;font-size:12.5px;font-weight:700;color:var(--muted);min-height:62px}
nav button.on{color:var(--accent)}
nav button .ic{display:block;font-size:22px;line-height:1.2}
/* ===== Modal / toast / loading ===== */
#modalWrap{position:fixed;inset:0;z-index:60;display:none;background:rgba(17,24,39,.5);align-items:flex-end;justify-content:center}
#modalWrap.open{display:flex}
#modal{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;box-shadow:0 -10px 30px rgba(17,24,39,.25)}
#modal h2{font-size:18px;margin-bottom:4px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:70;background:var(--dark);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14.5px;max-width:92vw;text-align:center;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.err{background:var(--red)}
#loading{position:fixed;inset:0;z-index:80;background:rgba(243,244,246,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px}
#loading.open{display:flex}
.spin{width:46px;height:46px;border:5px solid #D1D5DB;border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ===== Skeleton (speed): شكل هيكلي بنفس تخطيط الشاشة يظهر بدل الشاشة الفاضية أثناء التحميل ===== */
.skel{background:#E8ECF1;border-radius:8px;animation:skp 1.2s ease-in-out infinite}
@keyframes skp{0%,100%{opacity:1}50%{opacity:.55}}
.banner{background:#FEF3C7;border:1px solid #FCD34D;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
.banner.err{background:#FEE2E2;border-color:#FCA5A5}
.stepbar{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding:9px 2px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.step.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.line-row{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}
/* ===== Invoice — style 2 (neumorphic, as picked by the user; kept as-is) ===== */
.invoice{background:#EDF0F6;border-radius:22px;box-shadow:9px 9px 18px #B9C1CE,-9px -9px 18px #fff;padding:14px}
.inv-title{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;text-align:center;font-size:20px;font-weight:800;padding:14px 8px;border-radius:16px;box-shadow:0 6px 14px rgba(37,99,235,.35)}
.inv-company{text-align:center;font-size:13px;color:#64748B;padding:10px 4px 4px}
.inv-meta{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.inv-meta>div{flex:1;min-width:200px;padding:10px 12px;font-size:14px;background:#E6E9F0;border-radius:14px;box-shadow:inset 4px 4px 8px #C8CFDA,inset -4px -4px 8px #fff}
.inv-meta .lbl{color:#64748B;font-size:12.5px}
.inv-warn{background:#FEF2F2;color:#B91C1C;font-weight:700;text-align:center;padding:9px;font-size:14px}
.inv-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
.inv-table th{background:#DBEAFE;color:#1D4ED8;padding:10px 6px;font-size:13.5px;border:0}
.inv-table th:first-child{border-radius:0 12px 12px 0}
.inv-table th:last-child{border-radius:12px 0 0 12px}
.inv-table td{padding:9px 6px;border:0;border-bottom:1px solid #D7DEE8;text-align:center}
.inv-table td.nm{text-align:right}
.inv-table tr.alt td{background:#E4E9F1}
.inv-totals{padding:12px 14px}
.inv-totals .kv{font-size:15.5px}
.inv-grand{background:linear-gradient(180deg,#3B82F6,#2563EB);color:#fff;border-radius:14px;padding:11px 12px;display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:8px 0;box-shadow:0 6px 14px rgba(37,99,235,.3)}
.inv-notes{font-size:13px;color:#64748B;padding:10px 12px;background:#E6E9F0;border-radius:14px;box-shadow:inset 4px 4px 8px #C8CFDA,inset -4px -4px 8px #fff}
.inv-foot{text-align:center;color:#94A3B8;font-size:12px;padding:8px 0 2px}
.inv-bottom{display:flex;gap:14px;padding:12px 0 4px;flex-wrap:wrap;align-items:flex-start}
.inv-bottom .inv-notes{flex:1.15;min-width:140px}
.inv-bottom .inv-totals{flex:1;min-width:165px;padding:0}
.inv-bottom .inv-totals .kv{font-size:14.5px}
.order-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm)}
.order-row .o-no{color:var(--muted);font-size:12.5px;white-space:nowrap}
.order-row .o-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:15px}
.order-row .o-phone{direction:ltr;unicode-bidi:isolate;font-size:13px;color:var(--muted);white-space:nowrap}
.order-row .o-amt{font-weight:800;font-size:15px;white-space:nowrap}
.order-row .badge{white-space:nowrap}
.item-thumb{width:56px;height:56px;object-fit:cover;border-radius:12px;flex:none;border:1px solid var(--line)}
.photo-prev{width:100%;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#F8FAFC;display:block}
.photo-actions{display:flex;gap:8px;margin-top:8px}
/* ===== Dashboard ===== */
.dash-hero{background:var(--grad);color:#fff;border-radius:20px;padding:18px 16px;margin-bottom:14px;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.dash-hero .dh-date{font-size:13px;color:rgba(255,255,255,.85)}
.dash-hero .dh-title{font-size:22px;font-weight:800;margin:2px 0 10px}
.dash-hero .dh-stats{display:flex;gap:10px}
.dash-hero .dh-stat{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.dash-hero .dh-stat .v{font-size:19px;font-weight:800;line-height:1.25}
.dash-hero .dh-stat .l{font-size:12px;color:rgba(255,255,255,.85)}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qa-btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 6px;text-align:center;font-weight:800;font-size:14.5px;color:var(--ink);box-shadow:var(--sh-sm)}
.qa-btn .qa-ic{display:block;font-size:26px;line-height:1.1;margin-bottom:4px}
.qa-btn:active{background:#F3F4F6}
.alert-card{background:#FFFBEB;border:1px solid #FCD34D;border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;cursor:pointer}
.alert-card .ac-title{font-weight:800;font-size:15px;color:#92400E}
.merch-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm)}
.merch-row .mr-name{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.merch-row .mr-amt{font-weight:800;font-size:15px;white-space:nowrap}
/* ===== Kanban ===== */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kanban-col{flex:0 0 262px;max-width:262px;background:#F9FAFB;border:1px solid var(--line);border-radius:16px;padding:10px}
.kanban-col-head{display:flex;align-items:center;gap:6px;padding:2px 4px 10px}
.kanban-col-head .kch-name{flex:1;font-weight:800;font-size:15px}
.kanban-col-head .kch-count{background:#E5E7EB;color:#374151;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:800}
.kanban-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh-sm);cursor:pointer}
.kanban-card:active{background:#F9FAFB}
.kanban-card .kc-top{display:flex;align-items:center;gap:6px}
.kanban-card .kc-no{color:var(--muted);font-size:12.5px;white-space:nowrap}
.kanban-card .kc-name{flex:1;min-width:0;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kanban-card .kc-amt{font-weight:800;font-size:15px;margin-top:4px}
.kanban-card .kc-phone{font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.kanban-move{margin-top:8px}
.kanban-move select{width:100%;min-height:40px;padding:8px 10px;font-size:13.5px}
/* ===== Items photo grid ===== */
.items-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--sh-sm);position:relative}
.grid-card:active{background:#F9FAFB}
.grid-photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#F3F4F6}
.grid-photo-ph{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#F3F4F6;color:var(--muted);font-size:34px}
.grid-body{padding:10px 12px 12px}
.grid-name{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-price{font-weight:800;font-size:15px;color:var(--accent);margin-top:2px}
.grid-stock{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid-edit{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:17px;box-shadow:0 2px 8px rgba(17,24,39,.18)}
/* ===== More sheet ===== */
.more-item{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:16px;color:var(--ink);margin-bottom:10px;text-align:right}
.more-item .mi-ic{font-size:22px}
.more-item .mi-sub{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
@media print{
  header,nav,.fab,#toast,#loading,#modalWrap,.no-print{display:none!important}
  body{background:#fff;padding-bottom:0}
  main{padding:0;max-width:none}
  .invoice{border:0;border-radius:0;background:#fff!important;box-shadow:none!important;padding:0}
  .inv-screen-wrap{padding:0!important}

    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('رفع الصورة اتأخر — اتأكد من النت وجرّب تاني.')); }, timeoutMs || 60000);
    var b = authBody(); b.action = action; b.payload = payload;
    fetch(cfg.url || API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (res) { clearTimeout(timer); if (!res || res.ok !== true) { var m = (res && res.error) || 'رد غير متوقع من السيرفر.'; if (hasToken() && String(m).indexOf('كلمة السر غير صحيحة') !== -1) { clearSession(); reject(new Error('انتهت الجلسة — سجّل دخولك تاني.')); } else reject(new Error(m)); } else resolve(res); })

/* طلب JSONP عام من غير إعداد مسبق — للإجراءات العامة (login/logout). */
function callNoAuth(action, payload, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var cb = 'pub_cb_' + (++__cbSeq) + '_' + Date.now();
    var done = false;
    var script = document.createElement('script');
    var timer = setTimeout(function () { finish(new Error('الطلب اتأخر أكتر من اللازم — جرّب تاني.')); }, timeoutMs || 30000);
    function finish(err, data) {
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      if (err) reject(err); else resolve(data);
    }
    window[cb] = function (res) {
      if (!res || res.ok !== true) finish(new Error((res && res.error) || 'رد غير متوقع من السيرفر.'));
      else finish(null, res);
    };
    script.onerror = function () { finish(new Error('تعذر الوصول للسيرفر — اتأكد من النت.')); };
    var url = API_URL + '?action=' + encodeURIComponent(action) + '&callback=' + encodeURIComponent(cb);
    if (payload !== undefined && payload !== null) url += '&payload=' + encodeURIComponent(JSON.stringify(payload));
    script.src = url;
    document.head.appendChild(script);
  });
}

function compressPhoto(img, maxSide, quality) {
  try {
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) return '';

    var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    var ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cw, ch);

      cv.width = cw2; cv.height = ch2; ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cw2, ch2);
      out = cv.toDataURL('image/jpeg', 0.65);
    }
    return out;
  } catch (e) { return ''; }
}

      (r.notes ? '<div class="muted small">' + esc(r.notes) + '</div>' : '') +
      '<div class="small">الرصيد التراكمي (عليك): <b>' + fmtMoney(r.balance) + '</b></div></div>' +
      '<div style="text-align:left"><b style="font-size:16px">' + (num(r.amount) < 0 ? '−' : '+') + fmtMoney(Math.abs(num(r.amount))) + '</b>' +
      '<div><button class="btn btn-danger btn-sm" style="margin-top:6px" onclick="App.deleteMovement(\'' + r.kind + '\',' + r.row + ')">حذف</button></div></div></div></div>';
  });

/* ---------------- الأوردرات: القائمة ---------------- */
/* إجماليات الأوردرات حسب الحالة — عدد الأوردرات + إجمالي الأجواز + إجمالي الفلوس لكل حالة */
function statusTotalsHtml() {
  var t = {};
  STATUSES.forEach(function (s) { t[s] = { n: 0, pairs: 0, money: 0 }; });
  DATA.orders.forEach(function (o) {
    var s = statusOf(o);
    if (!t[s]) t[s] = { n: 0, pairs: 0, money: 0 };
    t[s].n++; t[s].pairs += num(o.pairs); t[s].money += num(o.total);
  });
  var rows = STATUSES.map(function (s) {
    var x = t[s];
    return '<div class="kv"><span>' + esc(s) + ' <span class="muted small">(' + fmtNum(x.n) + ' أوردر)</span></span><b>' + fmtNum(x.pairs) + ' زوج • ' + fmtMoney(x.money) + '</b></div>';
  }).join('');
  return '<div class="card"><h2>إجماليات حسب الحالة</h2>' + rows + '</div>';
}
function screenOrders() {
  if (!DATA) return '';
  var q = UI.orderQ.trim();
  var extCount = DATA.orders.filter(isExternalOrder).length;
  var list = DATA.orders.filter(function (o) {
    if (UI.orderFilter === 'external') { if (!isExternalOrder(o)) return false; }
    else if (UI.orderFilter !== 'all' && statusOf(o) !== UI.orderFilter) return false;
    if (q && (o.customer + ' ' + phonesText(o)).indexOf(q) === -1) return false;
    return true;
  });
  list.sort(function (a, b) { return num(b.no) - num(a.no); });
  /* فلتر «خارجي» بيتعرض قائمة على طول (اللوحة متقسمة حسب الحالة، والخارجي حالة تم الصرف) */
  var view = (UI.orderFilter === 'external') ? 'list' : UI.orderView;
  var h = '<div class="row" style="margin-bottom:10px"><button class="btn btn-pri grow" onclick="App.newOrder()">+ أوردر جديد</button><button class="btn btn-dark grow" onclick="App.newExternalOrder()">➕ اوردر خارجي</button></div>';
  h += '<div class="toolbar"><input type="text" id="orderSearch" placeholder="ابحث بالاسم أو التليفون..." value="' + esc(UI.orderQ) + '"></div>';
  h += '<div class="tabs"><button class="tab' + (view !== 'list' ? ' on' : '') + '" onclick="App.setOrderView(\'board\')">لوحة</button>' +
       '<button class="tab' + (view === 'list' ? ' on' : '') + '" onclick="App.setOrderView(\'list\')">قائمة</button></div>';
  h += '<div class="chips"><button class="chip' + (UI.orderFilter === 'all' ? ' on' : '') + '" onclick="App.setOrderFilter(\'all\')">الكل</button>' +
    STATUSES.map(function (s) { return '<button class="chip' + (UI.orderFilter === s ? ' on' : '') + '" onclick="App.setOrderFilter(\'' + s + '\')">' + esc(s) + '</button>'; }).join('') +
    '<button class="chip' + (UI.orderFilter === 'external' ? ' on' : '') + '" onclick="App.setOrderFilter(\'external\')">خارجي (' + fmtNum(extCount) + ')</button></div>';
  if (!DATA.orders.length) return h + emptyState('▦', 'لسه مفيش أوردرات', 'اعمل أول أوردر: اختار العميل، وضيف البنود، وأكّد — والفاتورة هتتولد لوحدها.', '<div style="margin-top:12px"><button class="btn btn-pri" onclick="App.newOrder()">+ أوردر جديد</button></div>');
  if (!list.length) return h + emptyState('🔍', 'مفيش أوردرات بالفلتر ده', 'غيّر الحالة أو امسح البحث.');
  h += statusTotalsHtml();
  if (view === 'list') {
    list.forEach(function (o) {
      var ph = o.phone1 || o.phone2 || '';
      h += '<div class="order-row" onclick="App.openOrderRow(' + o._row + ')"><span class="o-no">#' + fmtNum(o.no) + '</span>' +
        '<span class="o-name">' + esc(o.customer) + (o.isVip === 'نعم' ? ' ★' : '') + (isExternalOrder(o) ? ' ' + externalBadge() : '') + '</span>' +
        (ph ? '<span class="o-phone">' + esc(ph) + '</span>' : '') +
        '<span class="o-amt">' + fmtMoney(o.total) + '</span>' + statusBadge(statusOf(o)) + '</div>';
    });
    return h;
  }
  var cols = ['جديد', 'تم الشحن', 'تم الاستلام', 'تم الصرف'];
  var archive = [];
  var byStatus = {};
  cols.forEach(function (s) { byStatus[s] = []; });
  list.forEach(function (o) {
    var st = statusOf(o);
    if (byStatus[st]) byStatus[st].push(o);
    else archive.push(o);
  });
  var showCols = cols, showArchive = true;
  if (UI.orderFilter !== 'all') {
    if (cols.indexOf(UI.orderFilter) !== -1) { showCols = [UI.orderFilter]; showArchive = false; }
    else { showCols = []; showArchive = true; }
  }
  h += '<div class="kanban">';
  showCols.forEach(function (s) { h += kanbanColHtml(s, byStatus[s]); });
  if (showArchive) h += kanbanColHtml('مرتجع / ملغي', archive);
  h += '</div>';
  return h;
}
function kanbanColHtml(title, orders) {
  var h = '<div class="kanban-col"><div class="kanban-col-head"><span class="kch-name">' + esc(title) + '</span><span class="kch-count">' + fmtNum(orders.length) + '</span></div>';
  if (!orders.length) h += '<div class="muted small" style="padding:6px 4px">مفيش أوردرات هنا.</div>';
  orders.forEach(function (o) {
    var ph = o.phone1 || o.phone2 || '';

function newWizard(prefillVipRow, isExternal) {
  var w = {
    step: 1,
    external: !!isExternal,
    date: todayStr(),
    vipRow: 0, customer: '', phone1: '', phone2: '', address: '', isVip: false,
    lines: [{ item: '', color: '', dozens: '', discount: '', customPrice: '' }],
    shipping: '', discount: '', deposit: '', method: 'كاش / نقدي', notes: '', status: 'جديد'
  };
  if (prefillVipRow) {
    var v = null; DATA.vips.forEach(function (x) { if (x._row === prefillVipRow) v = x; });
    if (v) { w.vipRow = v._row; w.customer = v.name; w.phone1 = v.phone1; w.phone2 = v.phone2; w.address = v.address; w.isVip = true; }
  }
  return w;
}
function wizardTotals(w) {
  var sub = 0, pairs = 0;
  w.lines.forEach(function (ln) {
    var it = itemByName(ln.item);
    var price = ln.customPrice !== '' && ln.customPrice !== null ? num(ln.customPrice) : (it ? num(it.price) : 0);
    var dz = num(ln.dozens);
    sub += dz * pairsPerDozen() * price - num(ln.discount);
    pairs += dz * pairsPerDozen();
  });
  var grand = sub + num(w.shipping) - num(w.discount);
  return { subtotal: sub, pairs: pairs, grand: grand, remaining: grand - num(w.deposit) };
}
/* سطر معلومات بند المعالج: سعر الزوج + مخزون الموديل + مخزون اللون المختار */
function wizardLineInfo(ln, it) {
  if (!it) return ln.item ? 'الصنف ده مش موجود في الأصناف — اكتب الاسم زي ما هو مسجل.' : '';
  var s = 'سعر الزوج: ' + fmtMoney(it.price) + ' • المخزون: ' + fmtNum(it.stock) + ' زوج ' + (it.status === 'خلص' ? '(خلص!)' : it.status === 'قرب يخلص' ? '(قرب يخلص)' : '');
  if (ln.color) {
    var cs = colorStockOf(it.model, ln.color);
    s += cs ? (' • مخزون «' + ln.color + '»: ' + fmtNum(cs.stock) + ' زوج') : (' • «' + ln.color + '»: لسه مفيش مخزون');
  }
  return s;
}
/* البند كامل وجاهز يتضاف لوحده: موديل موجود في الأصناف + لون + كمية دستة صحيحة (> 0) */
function wizardLineComplete(ln) {
  if (!ln || !ln.item || !ln.item.trim()) return false;
  if (!itemByName(ln.item.trim())) return false;
  if (!ln.color) return false;
  if (!ln.dozens || Number(ln.dozens) <= 0) return false;
  return true;
}
/* لازم يفضل فيه صف مفتوح (مش كامل) في المعالج عشان الإضافة — لو كل البنود بقت كاملة، ضيف صف فاضي */
function wizardEnsureOpenRow() {
  var w = UI.wizard; if (!w) return;
  var hasOpen = w.lines.some(function (ln) { return !wizardLineComplete(ln); });
  if (!hasOpen) w.lines.push({ item: '', color: '', dozens: '', discount: '', customPrice: '' });
}
/* لو آخر بند في المعالج بقى كامل، ضيف صف فاضي جديد لوحده (نفس منطق زرار «إضافة بند» القديم)
   عشان المستخدم يكمل إضافة البند اللي بعده على طول من غير ما يدوس على حاجة.
   بترجع true لو ضافت صف جديد (وعملت render)، و false لو البند لسه مش كامل. */
function wizardMaybeAutoAdd(i) {
  var w = UI.wizard; if (!w || !w.lines[i]) return false;
  if (i !== w.lines.length - 1) return false; /* بس الصف الأخير — اللي بيتملا دلوقتي */

function updateWizardTotals() {
  var w = UI.wizard; if (!w) return;
  var t = wizardTotals(w);
  var a = $('wzSub'); if (a) a.textContent = fmtMoney(t.subtotal);
  var b = $('wzPairs'); if (b) b.textContent = fmtNum(t.pairs) + ' زوج';
  w.lines.forEach(function (ln, i) {
    var it = itemByName(ln.item);
    /* لو الموديل اتغيّر، مربعات اللون بتتحدّث واللون المختار بيتصفّر —
       بنتابع _tilesFor عشان ما نعيدش الرسم مع كل ضغطة زر.
       (قبل تحديث سطر المعلومات عشان ميتعرضش مخزون لون قديم على الموديل الجديد) */
    if (ln.item !== ln._tilesFor) {

/* ---------------- الفاتورة ---------------- */
/* تجميع بنود الأوردر للتجهيز من المخزن — بنود نفس الموديل ونفس اللون
   بتتجمع في سطر واحد بإجمالي الدست والأزواج، عشان لما يدخل المخزن
   ياخد كل موديل مرة واحدة بدل ما يلف على البنود سطر سطر.
   التجميع للعرض بس (البنود في الأوردر بتفضل منفصلة عشان المخزون). */
function groupPickLines(lines) {
  var groups = [], byLabel = {};
  lines.forEach(function (l) {
    var key = lineItemLabel(l);
    if (!byLabel[key]) {
      byLabel[key] = { label: key, dozens: 0, pairs: 0, lines: 0 };
      groups.push(byLabel[key]);
    }
    var g = byLabel[key];
    g.dozens += num(l.dozens);
    g.pairs += num(l.pairs);
    g.lines += 1;
  });
  return groups;
}
/* تجميع بنود الفاتورة حسب سعر الزوج — البنود اللي سعر الجوز بتاعها واحد
   بتتجمع في سطر واحد، والبيان فيه «موديل لون» لكل بند وبينهم « / ».
   التجميع للعرض بس (البنود في الأوردر بتفضل منفصلة عشان المخزون). */
function groupInvoiceLines(lines) {
  var groups = [], byPrice = {};
  lines.forEach(function (l) {
    var key = String(num(l.price));
    if (!byPrice[key]) {
      byPrice[key] = { price: num(l.price), labels: [], dozens: 0, pairs: 0, discount: 0, total: 0 };
      groups.push(byPrice[key]);
    }
    var g = byPrice[key];
    g.labels.push(lineItemLabel(l));
    g.dozens += num(l.dozens);
    g.pairs += num(l.pairs);
    g.discount += num(l.discount);
    g.total += num(l.total);
  });
  return groups;
}

/* أرقام مؤقتة للمخزون قبل الجرد الحقيقي: كل موديل وألوانه بحقول دستة،
   واللي يتكتب هو الرصيد الحالي للون. زرار واحد بيحفظ كل اللي اتغير،
   وبعد الجرد الحقيقي يرجع يعدل نفس الأرقام من هنا. */
/* قايمة البيك أب جوه التطبيق: تجميع كل الموديلات المطلوبة في كل الأوردرات
   الجديدة في قايمة واحدة — نفس منطق picking.html (showPickup).
   القايمة بتتقرا من البيانات لحظة فتحها، فالأوردر اللي تغيّرت حالته
   (مبقاش «جديد») بيطلع منها لوحده. */
function screenPickup() {
  if (!DATA) return '';
  var fresh = DATA.orders.filter(function (o) { return isActiveOrder(o) && statusOf(o) === 'جديد'; }).sort(function (a, b) { return num(b.no) - num(a.no); });
  var h = '<button class="btn btn-ghost btn-sm" onclick="go(\'home\')">← الرئيسية</button>';
  if (!fresh.length) {
    h += '<div class="card" style="margin-top:10px"><h2>📦 قايمة البيك أب</h2><p class="muted">مفيش أوردرات جديدة دلوقتي.</p></div>';
    return h;
  }
  var groups = [], byLabel = {};
  fresh.forEach(function (o) {
    linesOf(o.no).forEach(function (l) {
      var key = lineItemLabel(l);
      if (!byLabel[key]) {
        byLabel[key] = { label: key, model: l.item, color: l.color || '', dozens: 0, pairs: 0, orders: [] };
        groups.push(byLabel[key]);
      }

      g.pairs += num(l.pairs);
      if (g.orders.indexOf(o.no) === -1) g.orders.push(o.no);
    });
  });
  var totDoz = 0, totPairs = 0, shortCount = 0;
  groups.forEach(function (g) {
    totDoz += g.dozens; totPairs += g.pairs;

  });

    '<p class="muted small" style="margin:8px 0 0">الأوردر اللي تغيّر حالته بيطلع من القايمة دي لوحده — دوس «تحديث البيانات» عشان تشوف آخر حالة.</p>' +

  if (!groups.length) h += '<p class="muted">الأوردرات الجديدة مفيهاش بنود.</p>';
  groups.forEach(function (g) {
    var cs = colorStockOf(g.model, g.color);
    var avail = cs ? num(cs.stock) : null;
    var remain = avail === null ? null : avail - g.pairs;
    var short = avail !== null && g.pairs > avail;
    var it = itemByName(g.model);
    var thumb = (it && it.photo) ? '<img class="pick-thumb" src="' + esc(it.photo) + '" alt="" loading="lazy" decoding="async">' : '<span class="pick-thumb pick-thumb-ph">👞</span>';
    h += '<label class="pick-row' + (short ? ' short' : '') + '"><input type="checkbox" onchange="this.parentNode.classList.toggle(\'picked\', this.checked)">' + thumb +
      '<span class="grow"><b class="pick-name">' + esc(g.label) + '</b>' +
      '<div class="small muted">أوردرات: ' + g.orders.map(function (n) { return '#' + fmtNum(n); }).join('، ') + '</div>' +
      '<div class="stk"><span>المطلوب: <b>' + fmtNum(g.pairs) + ' زوج</b></span>' +
      '<span>المتاح: <b>' + (avail === null ? '—' : fmtNum(avail) + ' زوج') + '</b></span>' +
      '<span>المتبقي: <b class="' + (remain !== null && remain < 0 ? 'warn' : '') + '">' + (remain === null ? '—' : fmtNum(remain) + ' زوج') + '</b></span></div>' +
      (short ? '<div class="warn" style="margin-top:6px">⚠️ المخزن مش كفاية — ناقص ' + fmtNum(g.pairs - avail) + ' زوج</div>' : '') + '</span>' +
      '<span style="text-align:left;white-space:nowrap"><b style="font-size:18px">' + fmtDoz(g.dozens) + ' دستة</b><br><span class="small muted">' + fmtNum(g.pairs) + ' زوج</span></span></label>';
  });
  h += '<div class="kv"><span>إجمالي التجهيز</span><b>' + fmtDoz(totDoz) + ' دستة (' + fmtNum(totPairs) + ' زوج)</b></div></div>';
  h += '<div class="row"><button class="btn btn-ghost" style="flex:1" onclick="go(\'home\')">رجوع</button>' +
    '<button class="btn btn-dark" style="flex:1" onclick="refresh({})">تحديث البيانات</button></div>';
  return h;
}

  saveStockCount: function (btn) {

    document.querySelectorAll('.sc-input').forEach(function (inp) {
      var v = Number(inp.value);
      if (isNaN(v) || v < 0) return;
      if (v !== Number(inp.getAttribute('data-current'))) {
        changed.push({ model: inp.getAttribute('data-model'), color: inp.getAttribute('data-color'), dozens: v });
      }
    });
    if (!changed.length) { toast('مفيش أرقام اتغيرت — مفيش حاجة تتحفظ.'); return; }
    if (btn) btn.disabled = true;
    showLoading('جارٍ حفظ الأرقام المؤقتة...', '0 من ' + changed.length);
    var i = 0, done = 0;
    function next() {
      if (i >= changed.length) {
        hideLoading();
        if (btn) btn.disabled = false;
        return afterWrite('تم حفظ ' + done + ' رقم مؤقت ✓ — عدّلهم تاني بعد الجرد').then(function () { go('stockCount'); });
      }
      var c = changed[i++];
      $('loadingHint').textContent = done + ' من ' + changed.length;
      callApi('setColorStock', c).then(function () { done++; next(); }).catch(function (e) {
        hideLoading();

    }
    next();

    var newExtras = extras.join(', ');
    showLoading('جارٍ إضافة اللون...');
    /* updateItem بيكتب الموديل + الألوان الإضافية + السعر + الملاحظات بس — الصورة والمخزون محدش بيلمسهم.
       بنبعت السعر والملاحظات الحاليين زي ما هما عشان ميتغيّروش. */
    callApi('updateItem', { row: it._row, model: it.model, extraColors: newExtras, price: it.price, notes: it.notes || '' })
      .then(function () {
        hideLoading();
        it.extraColors = newExtras;
        App.hideNewColorInput(containerId);
        refreshColorTiles(containerId, hiddenId, modelName, name, hideWhenEmpty);
        App.pickColor(hiddenId, name, colorTileButton(containerId, name));
        toast('تمت إضافة اللون «' + name + '» للموديل ' + it.model);
      })
      .catch(function (e) { hideLoading(); toast(e.message, true); });
  },
  /* قائمة الموديلات بالصور: ▼ بيعرض كل الموديلات، والكتابة بتفلتر */
  toggleModelPicker: function (panelId, inputId) {
    var p = $(panelId); if (!p) return;
    if (p.style.display === 'none') {
      p.innerHTML = modelPickerRowsHtml(inputId, panelId, '');
      p.style.display = 'block';
    } else p.style.display = 'none';
  },
  modelPickerInput: function (inputId, panelId) {
    var p = $(panelId); if (!p) return;
    /* بعد اختيار صف من القائمة منفتحش اللوحة تاني من حدث الـ input اللي بيتبعت */
    if (UI.__pickerPicked === panelId) { UI.__pickerPicked = null; return; }
    var inp = $(inputId);
    var q = inp ? inp.value : '';
    if (!q.trim()) { p.style.display = 'none'; return; }
    p.innerHTML = modelPickerRowsHtml(inputId, panelId, q);
    p.style.display = 'block';
  },
  pickModel: function (inputId, panelId, name) {
    var inp = $(inputId); if (!inp) return;
    var p = $(panelId); if (p) p.style.display = 'none';
    UI.__pickerPicked = panelId;
    inp.value = name;
    /* نبعت حدث input عشان يشتغل نفس مسار الكتابة بالظبط (تحديث الإجمالي + مربعات اللون) */
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.focus();
  },
  wizardAddLine: function () { UI.wizard.lines.push({ item: '', color: '', dozens: '', discount: '', customPrice: '' }); render(); },
  wizardRemoveLine: function (i) {
    var w = UI.wizard; if (!w) return;
    w.lines.splice(i, 1);
    wizardEnsureOpenRow();
    render();
  },
  wizardNext: function () {
    var w = UI.wizard;
    if (w.step === 1) {
      /* الأوردر الخارجي: اسم العميل اختياري — لو فاضي هيتسجل «عميل خارجي» عند الحفظ */
      if (!w.external && !w.customer.trim()) { toast('اكتب اسم العميل أو اختار عميل مميز.', true); return; }
      w.step = 2; render(); return;
    }
    if (w.step === 2) {
      /* شيل أي بند فاضي تماماً (صف الإضافة التلقائي) قبل التحقق — ميتعدّش بند */
      w.lines = w.lines.filter(function (ln) {
        return (ln.item && ln.item.trim()) || ln.color || ln.dozens || ln.discount || ln.customPrice;
      });
      if (!w.lines.length) {
        toast('ضيف بند واحد على الأقل للأوردر.', true);
        w.lines.push({ item: '', color: '', dozens: '', discount: '', customPrice: '' });
        render();
        return;
      }
      for (var i = 0; i < w.lines.length; i++) {
        var ln = w.lines[i];
        if (!ln.item.trim()) { toast('اختار الصنف في بند ' + (i + 1) + '.', true); return; }
        if (!itemByName(ln.item.trim())) { toast('الصنف «' + ln.item + '» مش موجود في الأصناف — اختاره من القائمة.', true); return; }
        if (!ln.color) { toast('اختار اللون في بند ' + (i + 1) + ' من المربعات.', true); return; }
        if (modelColors(itemByName(ln.item.trim())).indexOf(ln.color) === -1) { toast('لون بند ' + (i + 1) + ' مش من ألوان الموديل ده.', true); return; }
        if (!ln.dozens || Number(ln.dozens) <= 0) { toast('اكتب الكمية بالدستة في بند ' + (i + 1) + '.', true); return; }
      }
      /* الأوردر الخارجي: المدفوع اختياري — بيفضل فاضي لحد ما يكتبه (مش بيتملا بالإجمالي لوحده) */
      w.step = 3; render(); return;
    }
  },
  wizardBack: function () {
    var w = UI.wizard; if (!w || w.step <= 1) return;
    w.step--;
    if (w.step === 2) wizardEnsureOpenRow(); /* رجعنا لخطوة البنود — لازم يفضل فيه صف مفتوح للإضافة */
    render();
  },
  confirmOrder: function () {
    var w = UI.wizard;
    if (!w) return;
    var lines = w.lines.map(function (ln) {
      return { item: ln.item.trim(), color: ln.color, dozens: Number(ln.dozens), discount: ln.discount === '' ? 0 : Number(ln.discount),
        customPrice: (ln.customPrice === '' || ln.customPrice === null) ? '' : Number(ln.customPrice), notes: '' };
    });
    var header = { date: w.date, customer: w.customer.trim(), phone1: w.phone1, phone2: w.phone2, address: w.address,
      status: 'جديد', method: w.method, shipping: w.shipping, discount: w.discount, deposit: w.deposit, notes: w.notes };
    showLoading('جارٍ تأكيد الأوردر وإنشاء الفاتورة...', 'متقفلش الصفحة لحد ما الفاتورة تظهر.');
    callApi('createOrder', { header: header, lines: lines }, 60000).then(function (res) {
      hideLoading();
      var t = wizardTotals(w);
      var order = { _row: res.row, no: res.orderNo, date: w.date, customer: header.customer, phone1: w.phone1, phone2: w.phone2,
        address: w.address, status: 'جديد', method: w.method, shipping: num(w.shipping), discount: num(w.discount),
        deposit: num(w.deposit), subtotal: t.subtotal, total: t.grand, remaining: t.remaining, pairs: t.pairs,
        disbStatus: 'لم يتم الصرف', notes: w.notes, counts: 'نعم', isVip: res.isVip ? 'نعم' : 'لا' };
      var invLines = lines.map(function (ln, i) {
        var it = itemByName(ln.item);
        var price = ln.customPrice === '' ? (it ? num(it.price) : 0) : num(ln.customPrice);
        return { _row: 0, orderNo: res.orderNo, item: ln.item, color: ln.color, dozens: ln.dozens, pairs: ln.dozens * pairsPerDozen(),
          price: price, discount: ln.discount, total: ln.dozens * pairsPerDozen() * price - ln.discount, deducts: 'نعم', notes: '' };
      });
      UI.invoice = { order: order, lines: invLines, fromWizard: true };
      UI.wizard = null;
      go('invoice');
      toast('تم تأكيد الأوردر #' + res.orderNo + ' — الفاتورة جاهزة ✓');
      refresh({ spinner: false, toastOnError: false }).then(function () {
        if (UI.screen === 'invoice' && UI.invoice && UI.invoice.fromWizard) {
          var fresh = orderByRow(res.row);
          if (fresh) { UI.invoice = { order: fresh, lines: linesOf(fresh.no), fromWizard: false }; render(); }
        }
      }).catch(function () {});
    }).catch(function (e) { hideLoading(); toast('تعذر تأكيد الأوردر: ' + e.message, true); });
  },
  /* حفظ الأوردر الخارجي: نفس createOrder بتاع الأوردر العادي (البنود مفصلة موديل+لون+دستة)
     بس بالحالة «تم الصرف» من الأول وملاحظات «اوردر خارجي» — فبيتخصم من المخزن على طول
     (معادلة «يخصم من المخزون؟» بتخصم أي حالة إلا مرتجع/ملغي)، ومن غير فاتورة.
     ملاحظة: إنشاء الأوردر بالحالة دي مبيضيفش العميل للعملاء المميزين —
     الإضافة التلقائية دي بتحصل بس لما الحالة تتغير بـ setOrderStatus. */
  confirmExternalOrder: function () {
    var w = UI.wizard;
    if (!w || !w.external) return;
    var lines = w.lines.map(function (ln) {
      return { item: ln.item.trim(), color: ln.color, dozens: Number(ln.dozens), discount: ln.discount === '' ? 0 : Number(ln.discount),
        customPrice: (ln.customPrice === '' || ln.customPrice === null) ? '' : Number(ln.customPrice), notes: '' };
    });
    var customer = w.customer.trim() || 'عميل خارجي';
    var notes = EXT_MARKER + (w.notes.trim() ? ' — ' + w.notes.trim() : '');
    var header = { date: w.date, customer: customer, phone1: w.phone1, phone2: w.phone2, address: w.address,
      status: 'تم الصرف', method: w.method, shipping: 0, discount: w.discount, deposit: w.deposit, notes: notes };
    showLoading('جارٍ حفظ الأوردر الخارجي...', 'هيتخصم من المخزن على طول.');
    callApi('createOrder', { header: header, lines: lines }, 60000).then(function (res) {
      hideLoading();
      UI.wizard = null;
      toast('تم حفظ الأوردر الخارجي #' + res.orderNo + ' — اتخصم من المخزن ✓');
      refresh({ spinner: false, toastOnError: false }).then(function () { App.openOrder(res.row); }).catch(function () { go('orders'); });
    }).catch(function (e) { hideLoading(); toast('تعذر حفظ الأوردر الخارجي: ' + e.message, true); });
  },
  /* فاتورة */
  printInvoice: function () { window.print(); },
  shareInvoice: function () {
    var inv = UI.invoice; if (!inv) return;
    var o = inv.order, st = settings();
    var text = 'فاتورة مبيعات ' + invoiceNo(o) + ' — ' + st.factoryName + '\n' +
      'العميل: ' + o.customer + '\n' +
      'التاريخ: ' + (o.date || '') + ' • الدفع: ' + (o.method || '—') + '\n' +
      '------------------------\n' +
      inv.lines.map(function (l, i) { return (i + 1) + '. ' + lineItemLabel(l) + ' — ' + fmtDoz(l.dozens) + ' دستة (' + fmtNum(l.pairs) + ' زوج) = ' + fmtMoney(l.total); }).join('\n') +
      '\n------------------------\n' +
      'المجموع الفرعي: ' + fmtMoney(o.subtotal) + '\n' +
      'الشحن: ' + fmtMoney(o.shipping) + ' • الخصم: ' + fmtMoney(o.discount) + '\n' +
      'الإجمالي: ' + fmtMoney(o.total) + '\n' +
      'إجمالي الأزواج: ' + fmtNum(o.pairs) + ' زوج\n' +
      'العربون: ' + fmtMoney(o.deposit) + ' • المتبقي: ' + fmtMoney(o.remaining);
    if (navigator.share) {
      navigator.share({ title: 'فاتورة ' + invoiceNo(o), text: text }).catch(function () {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('اتنسخ نص الفاتورة — الصقه في واتساب أو أي مكان.'); })
        .catch(function () { App.showShareText(text); });
    } else App.showShareText(text);
  },
  showShareText: function (text) {
    openModal('<h2>نص الفاتورة</h2><p class="muted small">انسخ النص ده والصقه في واتساب:</p>' +
      '<textarea readonly style="min-height:220px" onclick="this.select()">' + esc(text) + '</textarea>' +
      '<div class="modal-actions"><button class="btn btn-pri btn-block" onclick="closeModal()">تمام</button></div>');
  },
  /* صرف */
  setDisbFilter: function (f) { UI.disbFilter = f; render(); }
};

/* ---------------- التشغيل ---------------- */
document.querySelectorAll('#bottomNav button').forEach(function (b) {
  b.addEventListener('click', function () {
    var nav = b.getAttribute('data-nav');
    if (nav === 'more') { App.openMore(); return; }
    go(nav);
  });
});
$('btnRefresh').addEventListener('click', function () { refresh({}).catch(function () {}); });
$('btnSettings').addEventListener('click', function () { go('settings'); });
window.addEventListener('online', function () { updateHeaderStatus(true); refresh({ spinner: false }).catch(function () {}); });
window.addEventListener('offline', function () { updateHeaderStatus(false); toast('النت مقطوع — التطبيق هيحاول تاني لما النت يرجع.', true); });
/* قفل قوائم اختيار الموديلات بضغطة برّه أو Escape */
document.addEventListener('click', function (e) {
  if (!e.target.closest || !e.target.closest('.picker-wrap')) closeModelPickers();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeModelPickers();
});

// تحديث تلقائي كل 25 ثانية — بس لما الصفحة ظاهرة ومفيش نموذج مفتوح ولا كتابة شغالة.
setInterval(function () {
  if (!configured() || document.hidden || modalOpen || refreshing) return;
  if (UI.screen === 'orderNew' || UI.screen === 'invoice') return;
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
  refresh({ spinner: false, toastOnError: false }).catch(function () {});
}, 25000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* PWA اختياري — التطبيق بيشتغل من غيره */ });
  });
}

if (!configured()) { go('setup'); }
else { refresh({ loadingText: 'جارٍ تحميل بيانات المصنع...', toastOnError: false }).catch(function () {}); }
</script>
</body>
</html>
