<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E293B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مخزن ورشة آل هاشم</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--dark:#1E293B;--dark2:#334155;--bg:#F1F5F9;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--green:#059669;--green-d:#047857;--red:#DC2626;--amber:#D97706;--blue:#2563EB;--indigo:#4F46E5;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:86px}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue)}
/* ===== Header ===== */
header{position:sticky;top:0;z-index:40;background:var(--dark);color:#fff;padding:10px 14px 9px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hd-row{display:flex;align-items:center;gap:10px}
.hd-title{flex:1;min-width:0}
.hd-title h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-sub{font-size:12px;color:#CBD5E1;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#94A3B8;display:inline-block;flex:none}
.dot.on{background:#34D399}.dot.off{background:#F87171}
.icon-btn{background:var(--dark2);color:#fff;border:0;border-radius:10px;width:44px;height:44px;font-size:21px;line-height:1;flex:none}
.icon-btn:active{opacity:.75}
/* ===== Layout ===== */
main{max-width:720px;margin:0 auto;padding:14px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.card h2{font-size:17px;margin-bottom:8px}
.muted{color:var(--muted);font-size:13.5px}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px;text-align:center}
.stat .v{font-size:21px;font-weight:800;line-height:1.3}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.warn .v{color:var(--amber)}.stat.bad .v{color:var(--red)}.stat.good .v{color:var(--green)}
.section-title{font-size:16px;font-weight:800;margin:18px 2px 8px}
/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15.5px;min-height:48px}
.btn-pri{background:var(--green);color:#fff}.btn-pri:active{background:var(--green-d)}
.btn-dark{background:var(--dark);color:#fff}
.btn-ghost{background:#E2E8F0;color:var(--ink)}
.btn-danger{background:#FEE2E2;color:var(--red)}
.btn-danger-solid{background:var(--red);color:#fff}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;min-height:40px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.55}
.fab{position:fixed;left:16px;bottom:96px;z-index:35;background:var(--green);color:#fff;border:0;border-radius:999px;padding:13px 20px;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(5,150,105,.45)}
/* ===== Forms ===== */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
label:first-child{margin-top:0}
input[type=text],input[type=number],input[type=tel],input[type=date],input[type=url],input[type=password],select,textarea{width:100%;border:1.5px solid #CBD5E1;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);min-height:48px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
input[readonly]{background:#F8FAFC;color:var(--muted)}
textarea{resize:vertical;min-height:64px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{border:1.5px solid #CBD5E1;background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;min-height:40px}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip.warn.on{background:var(--amber);border-color:var(--amber)}
/* ===== Lists ===== */
.item-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px}
.item-card:active{background:#F8FAFC}
.item-name{font-weight:800;font-size:16.5px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-green{background:#D1FAE5;color:#065F46}.b-amber{background:#FEF3C7;color:#92400E}.b-red{background:#FEE2E2;color:#991B1B}
.b-blue{background:#DBEAFE;color:#1E40AF}.b-indigo{background:#E0E7FF;color:#3730A3}.b-slate{background:#E2E8F0;color:#334155}
.badge-lg{font-size:13.5px;padding:5px 12px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:6px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:1.5px solid #CBD5E1;background:#fff;border-radius:11px;padding:10px 4px;font-weight:700;font-size:14px;min-height:44px}
.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini th,table.mini td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.mini th{color:var(--muted);font-size:12.5px}
/* ===== Bottom nav ===== */
nav{position:fixed;right:0;left:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:11px 2px 9px;font-size:13.5px;font-weight:700;color:var(--muted);min-height:60px}
nav button.on{color:var(--green)}
nav button .ic{display:block;font-size:20px;line-height:1.2}
/* ===== Modal / toast / loading ===== */
#modalWrap{position:fixed;inset:0;z-index:60;display:none;background:rgba(15,23,42,.55);align-items:flex-end;justify-content:center}
#modalWrap.open{display:flex}
#modal{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 26px}
#modal h2{font-size:18px;margin-bottom:4px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:70;background:var(--dark);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14.5px;max-width:92vw;text-align:center;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.err{background:var(--red)}
#loading{position:fixed;inset:0;z-index:80;background:rgba(241,245,249,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px}
#loading.open{display:flex}
.spin{width:46px;height:46px;border:5px solid #CBD5E1;border-top-color:var(--green);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:#FEF3C7;border:1px solid #FCD34D;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
.banner.err{background:#FEE2E2;border-color:#FCA5A5}
.stepbar{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding:9px 2px;border-radius:10px;background:#E2E8F0}
.step.on{background:var(--dark);color:#fff}
.line-row{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#F8FAFC}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}
/* ===== Invoice ===== */
.invoice{background:#fff;border:1px solid #CBD5E1;border-radius:6px;overflow:hidden}
.inv-title{background:var(--dark);color:#fff;text-align:center;font-size:21px;font-weight:800;padding:13px 8px;letter-spacing:1px}
.inv-company{background:var(--dark);color:#E2E8F0;text-align:center;font-size:13px;padding:0 10px 11px}
.inv-meta{display:flex;gap:0;background:#F8FAFC;border-bottom:1px solid var(--line)}
.inv-meta>div{flex:1;padding:10px 12px;font-size:14px}
.inv-meta .lbl{color:var(--muted);font-size:12.5px}
.inv-warn{background:#FEF2F2;color:#B91C1C;font-weight:700;text-align:center;padding:9px;font-size:14px}
.inv-table{width:100%;border-collapse:collapse;font-size:14.5px}
.inv-table th{background:var(--dark2);color:#fff;padding:9px 6px;font-size:13.5px;border:1px solid #94A3B8}
.inv-table td{padding:9px 6px;border:1px solid #CBD5E1;text-align:center}
.inv-table td.nm{text-align:right}
.inv-table tr.alt td{background:#F1F5F9}
.inv-totals{padding:12px 14px}
.inv-totals .kv{font-size:15.5px}
.inv-grand{background:var(--dark);color:#fff;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:8px 0}
.inv-notes{font-size:13px;color:var(--muted);padding:0 14px 6px}
.inv-foot{text-align:center;color:#94A3B8;font-size:12px;padding:10px;border-top:1px solid var(--line)}
.inv-bottom{display:flex;gap:14px;padding:12px 14px;flex-wrap:wrap;align-items:flex-start}
.inv-bottom .inv-notes{flex:1.15;min-width:140px;padding:0}
.inv-bottom .inv-totals{flex:1;min-width:165px;padding:0}
.inv-bottom .inv-totals .kv{font-size:14.5px}
.order-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.order-row .o-no{color:var(--muted);font-size:12.5px;white-space:nowrap}
.order-row .o-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:15px}
.order-row .o-phone{direction:ltr;unicode-bidi:isolate;font-size:13px;color:var(--muted);white-space:nowrap}
.order-row .o-amt{font-weight:800;font-size:15px;white-space:nowrap}
.order-row .badge{white-space:nowrap}
.item-thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--line)}
.photo-prev{width:100%;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#F8FAFC;display:block}
.photo-actions{display:flex;gap:8px;margin-top:8px}
@media print{
  header,nav,.fab,#toast,#loading,#modalWrap,.no-print{display:none!important}
  body{background:#fff;padding-bottom:0}
  main{padding:0;max-width:none}
  .invoice{border:0;border-radius:0}
  .inv-screen-wrap{padding:0!important}
}
@media (min-width:560px){.grid3{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <div class="hd-row">
    <div class="hd-title">
      <h1 id="factoryTitle">ورشة آل هاشم</h1>
      <div class="hd-sub"><span class="dot" id="netDot"></span><span id="lastUpdate">مش متصل بعد</span></div>
    </div>
    <button class="icon-btn" id="btnRefresh" title="تحديث" aria-label="تحديث">⟳</button>
    <button class="icon-btn" id="btnSettings" title="الإعدادات" aria-label="الإعدادات">⚙</button>
  </div>
</header>
<main id="app"></main>
<nav id="bottomNav">
  <button data-nav="home"><span class="ic">⌂</span>الرئيسية</button>
  <button data-nav="items"><span class="ic">▤</span>الأصناف</button>
  <button data-nav="merchants"><span class="ic">◈</span>التجار</button>
  <button data-nav="orders"><span class="ic">▦</span>الأوردرات</button>
  <button data-nav="disb"><span class="ic">✓</span>الصرف</button>
</nav>
<div id="modalWrap"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>
<div id="loading"><div class="spin"></div><div id="loadingText" style="font-weight:700">جارٍ التحميل...</div><div class="muted small" id="loadingHint"></div></div>
<script>
'use strict';
/* ================================================================
   مخزن ورشة آل هاشم — تطبيق ويب (PWA)
   قاعدة البيانات: شيت جوجل، عن طريق Apps Script (JSONP).
   لا توجد أي بيانات تجريبية هنا — كل حاجة بتيجي من الشيت.
   ================================================================ */
var CFG_KEY = 'hsh_factory_cfg_v1';
var STATUSES = ['جديد', 'تم الشحن', 'تم الاستلام', 'تم الصرف', 'مرتجع', 'ملغي'];
var METHODS = ['كاش / نقدي', 'تحويل', 'محفظة إلكترونية', 'آجل'];
var DEFAULT_PRESETS = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10, 12];

var cfg = loadCfg();
var DATA = null;          // آخر بيانات جاية من الشيت
var lastOkAt = null;
var modalOpen = false;
var UI = {
  screen: 'home',
  itemQ: '', itemStatus: 'all', itemSort: 'name', priceMin: '', priceMax: '',
  merchRow: null, merchTab: 'all',
  orderFilter: 'all', orderQ: '', orderRow: null,
  disbFilter: 'all',
  wizard: null, invoice: null,
  merchantPreset: null, vipPrefill: null
};

/* ---------------- أدوات ---------------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(v, def) {
  if (v === '' || v === null || v === undefined) return (def === undefined ? 0 : def);
  var x = Number(String(v).replace(/,/g, ''));
  return isNaN(x) ? (def === undefined ? 0 : def) : x;
}
function fmtMoney(v) {
  var x = num(v);
  return x.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ج.م';
}
function fmtNum(v) { return num(v).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function fmtDoz(v) {
  var x = num(v);
  return (Math.round(x * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function timeStr(d) {
  d = d || new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function loadCfg() {
  try { var c = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); return { url: c.url || '', secret: c.secret || '' }; }
  catch (e) { return { url: '', secret: '' }; }
}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }
function configured() { return !!(cfg.url && cfg.secret); }
function presets() { return (DATA && DATA.presets && DATA.presets.length) ? DATA.presets : DEFAULT_PRESETS; }
function pairsPerDozen() { return (DATA && DATA.settings) ? num(DATA.settings.pairsPerDozen, 10) : 10; }
function settings() {
  return (DATA && DATA.settings) || { factoryName: 'ورشة آل هاشم', address: 'منشية ناصر، القاهرة، مصر', phone1: '01275440919', phone2: '01034837061', note1: '', note2: '', note3: '', threshold: 20 };
}
function statusOf(o) { return o.status || 'جديد'; }
function isActiveOrder(o) { return o.counts !== 'لا' && statusOf(o) !== 'مرتجع' && statusOf(o) !== 'ملغي'; }
function statusBadge(st) {
  var map = { 'جديد': 'b-slate', 'تم الشحن': 'b-blue', 'تم الاستلام': 'b-indigo', 'تم الصرف': 'b-green', 'مرتجع': 'b-amber', 'ملغي': 'b-red' };
  return '<span class="badge ' + (map[st] || 'b-slate') + '">' + esc(st) + '</span>';
}
function stockBadge(st) {
  var map = { 'متوفر': 'b-green', 'قرب يخلص': 'b-amber', 'خلص': 'b-red' };
  return '<span class="badge ' + (map[st] || 'b-slate') + '">' + esc(st || '—') + '</span>';
}
function itemByName(name) {
  if (!DATA) return null;
  for (var i = 0; i < DATA.items.length; i++) if (DATA.items[i].name === name) return DATA.items[i];
  return null;
}
function orderByRow(row) {
  if (!DATA) return null;
  for (var i = 0; i < DATA.orders.length; i++) if (DATA.orders[i]._row === row) return DATA.orders[i];
  return null;
}
function linesOf(orderNo) {
  if (!DATA) return [];
  return DATA.lines.filter(function (l) { return num(l.orderNo) === num(orderNo); });
}
function phonesText(o) { return [o.phone1, o.phone2].filter(Boolean).join(' / '); }
function invoiceNo(order) {
  var y = (order.date || todayStr()).slice(0, 4) || new Date().getFullYear();
  return 'INV-' + y + '-' + String(num(order.no)).padStart(3, '0');
}

/* ---------------- الاتصال بالسيرفر (JSONP) ---------------- */
var __cbSeq = 0;
function callApi(action, payload, timeoutMs) {
  return new Promise(function (resolve, reject) {
    if (!configured()) { reject(new Error('التطبيق مش مظبط بعد — اكتب رابط السيرفر وكلمة السر.')); return; }
    var cb = 'hsh_cb_' + (++__cbSeq) + '_' + Date.now();
    var done = false;
    var script = document.createElement('script');
    var timer = setTimeout(function () { finish(new Error('الطلب اتأخر أكتر من اللازم — ممكن السيرفر بيصحى من النوم، جرّب تاني.')); }, timeoutMs || 30000);
    function finish(err, data) {
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      if (err) reject(err); else resolve(data);
    }
    window[cb] = function (res) {
      if (!res || res.ok !== true) finish(new Error((res && res.error) || 'رد غير متوقع من السيرفر.'));
      else finish(null, res);
    };
    script.onerror = function () { finish(new Error('تعذر الوصول للسيرفر — اتأكد من النت ومن رابط السيرفر.')); };
    var url = cfg.url + (cfg.url.indexOf('?') === -1 ? '?' : '&') +
      'action=' + encodeURIComponent(action) +
      '&secret=' + encodeURIComponent(cfg.secret) +
      '&callback=' + encodeURIComponent(cb);
    if (payload !== undefined && payload !== null) url += '&payload=' + encodeURIComponent(JSON.stringify(payload));
    script.src = url;
    document.head.appendChild(script);
  });
}

/* رفع صورة: POST نصي (من غير preflight) للـ Web app — doPost في Code.gs */
function postApi(action, payload, timeoutMs) {
  return new Promise(function (resolve, reject) {
    if (!configured()) { reject(new Error('التطبيق مش مظبط بعد — اكتب رابط السيرفر وكلمة السر.')); return; }
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('رفع الصورة اتأخر — اتأكد من النت وجرّب تاني.')); }, timeoutMs || 60000);
    fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ secret: cfg.secret, action: action, payload: payload }), signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (res) { clearTimeout(timer); if (!res || res.ok !== true) reject(new Error((res && res.error) || 'رد غير متوقع من السيرفر.')); else resolve(res); })
      .catch(function (e) { clearTimeout(timer); if (e && e.name === 'AbortError') return; reject(new Error('تعذر رفع الصورة — اتأكد من النت وجرّب تاني.')); });
  });
}

function showLoading(text, hint) {
  $('loadingText').textContent = text || 'جارٍ التحميل...';
  $('loadingHint').textContent = hint || '';
  $('loading').classList.add('open');
}
function hideLoading() { $('loading').classList.remove('open'); }
function toast(msg, isErr) {
  var t = $('toast');
  t.textContent = msg;
  t.className = isErr ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(t.__timer);
  t.__timer = setTimeout(function () { t.style.display = 'none'; }, 3500);
}
function updateHeaderStatus(online) {
  var dot = $('netDot');
  dot.className = 'dot ' + (online === true ? 'on' : online === false ? 'off' : '');

var refreshing = false;
function refresh(opts) {
  opts = opts || {};

  if (refreshing) return Promise.resolve();

  if (opts.spinner !== false) showLoading(opts.loadingText || 'جارٍ تحديث البيانات...', 'أول تحميل ممكن ياخد ثواني لو السيرفر كان نايم.');
  return callApi('read', null, 45000).then(function (res) {
    DATA = res; lastOkAt = new Date();

    render();
    return res;
  }).catch(function (err) {

    else if (opts.toastOnError !== false) toast('تعذر التحديث: ' + err.message, true);

}

/* تصغير الصورة على الموبايل قبل الرفع: أقصى ضلع 480px وJPEG — عشان تترفع بسرعة وتتخزن في Drive */
function compressPhoto(img, maxSide, quality) {
  try {
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) return '';
    var scale = Math.min(1, maxSide / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    var ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cw, ch);
    var out = cv.toDataURL('image/jpeg', quality || 0.72);
    if (out.length > 140000) {
      var cw2 = Math.max(1, Math.round(cw * 0.7)), ch2 = Math.max(1, Math.round(ch * 0.7));
      cv.width = cw2; cv.height = ch2; ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cw2, ch2);
      out = cv.toDataURL('image/jpeg', 0.65);
    }
    return out;
  } catch (e) { return ''; }
}

function newWizard(prefillVipRow) {
  var w = {
    step: 1,
    date: todayStr(),
    vipRow: 0, customer: '', phone1: '', phone2: '', address: '', isVip: false,
    lines: [{ item: '', dozens: '', discount: '', customPrice: '' }],
    shipping: '', discount: '', deposit: '', method: 'كاش / نقدي', notes: '', status: 'جديد'
  };
  if (prefillVipRow) {
    var v = null; DATA.vips.forEach(function (x) { if (x._row === prefillVipRow) v = x; });
    if (v) { w.vipRow = v._row; w.customer = v.name; w.phone1 = v.phone1; w.phone2 = v.phone2; w.address = v.address; w.isVip = true; }
  }
  return w;
}
function wizardTotals(w) {
  var sub = 0, pairs = 0;
  w.lines.forEach(function (ln) {
    var it = itemByName(ln.item);
    var price = ln.customPrice !== '' && ln.customPrice !== null ? num(ln.customPrice) : (it ? num(it.price) : 0);
    var dz = num(ln.dozens);
    sub += dz * pairsPerDozen() * price - num(ln.discount);
    pairs += dz * pairsPerDozen();
  });
  var grand = sub + num(w.shipping) - num(w.discount);
  return { subtotal: sub, pairs: pairs, grand: grand, remaining: grand - num(w.deposit) };
}
function updateWizardTotals() {
  var w = UI.wizard; if (!w) return;
  var t = wizardTotals(w);
  var a = $('wzSub'); if (a) a.textContent = fmtMoney(t.subtotal);
  var b = $('wzPairs'); if (b) b.textContent = fmtNum(t.pairs) + ' زوج';
  w.lines.forEach(function (ln, i) {

/* ---------------- الصرف ---------------- */
function screenDisb() {
  if (!DATA) return '';
  var active = DATA.orders.filter(isActiveOrder);
  var totalPairs = 0, paidPairs = 0, unpaidCount = 0;
  active.forEach(function (o) {
    totalPairs += num(o.pairs);
    if (o.disbStatus === 'تم الصرف') paidPairs += num(o.pairs); else unpaidCount++;
  });
  var unpaidPairs = totalPairs - paidPairs;
  var list = active.filter(function (o) {
    if (UI.disbFilter === 'unpaid') return o.disbStatus !== 'تم الصرف';
    if (UI.disbFilter === 'paid') return o.disbStatus === 'تم الصرف';
    return true;
  });
  list.sort(function (a, b) { return num(b.no) - num(a.no); });
  var h = '<div class="grid2">' +
    stat(fmtNum(totalPairs) + ' زوج', 'إجمالي أزواج النشطة', '') +
    stat(fmtNum(unpaidPairs) + ' زوج', 'لم يتم صرفها', unpaidPairs ? 'bad' : '') +
    stat(fmtNum(paidPairs) + ' زوج', 'تم صرفها', 'good') +
    stat(fmtNum(unpaidCount), 'أوردرات غير مصروفة', '') + '</div>';
  h += '<p class="muted small" style="margin:10px 2px">عشان تغيّر الحالة: افتح الأوردر وغيّر حالته إلى «تم الصرف» لما تحاسب، وهتتحدث هنا فوراً. الأوردرات الملغية والمرتجعة لا تظهر هنا.</p>';
  h += '<div class="chips">' +
    '<button class="chip' + (UI.disbFilter === 'all' ? ' on' : '') + '" onclick="App.setDisbFilter(\'all\')">الكل</button>' +
    '<button class="chip' + (UI.disbFilter === 'unpaid' ? ' on' : '') + '" onclick="App.setDisbFilter(\'unpaid\')">لم يتم الصرف فقط</button>' +
    '<button class="chip' + (UI.disbFilter === 'paid' ? ' on' : '') + '" onclick="App.setDisbFilter(\'paid\')">تم الصرف فقط</button></div>';
  if (!active.length) return h + emptyState('✓', 'لا توجد أوردرات نشطة', 'لما تعمل أوردرات هتظهر هنا بأجوازها وحالة صرفها.');
  if (!list.length) return h + emptyState('✓', 'مفيش أوردرات بالفلتر ده', 'غيّر الفلتر عشان تشوف باقي الأوردرات.');
  list.forEach(function (o) {
    h += '<div class="item-card" onclick="App.openOrder(' + o._row + ')"><div class="row"><div class="grow"><div class="item-name">#' + fmtNum(o.no) + ' — ' + esc(o.customer) + '</div>' +

      '<div style="text-align:left"><b style="font-size:17px">' + fmtNum(o.pairs) + ' زوج</b><div style="margin-top:4px"><span class="badge ' + (o.disbStatus === 'تم الصرف' ? 'b-green' : 'b-amber') + ' badge-lg">' + esc(o.disbStatus || 'لم يتم الصرف') + '</span></div></div></div></div>';
  });
  return h;
}

      var invLines = lines.map(function (ln, i) {
        var it = itemByName(ln.item);
        var price = ln.customPrice === '' ? (it ? num(it.price) : 0) : num(ln.customPrice);
        return { _row: 0, orderNo: res.orderNo, item: ln.item, dozens: ln.dozens, pairs: ln.dozens * pairsPerDozen(),
          price: price, discount: ln.discount, total: ln.dozens * pairsPerDozen() * price - ln.discount, deducts: 'نعم', notes: '' };
      });
      UI.invoice = { order: order, lines: invLines, fromWizard: true };
      UI.wizard = null;
      go('invoice');
      toast('تم تأكيد الأوردر #' + res.orderNo + ' — الفاتورة جاهزة ✓');
      refresh({ spinner: false, toastOnError: false }).then(function () {
        if (UI.screen === 'invoice' && UI.invoice && UI.invoice.fromWizard) {
          var fresh = orderByRow(res.row);
          if (fresh) { UI.invoice = { order: fresh, lines: linesOf(fresh.no), fromWizard: false }; render(); }
        }
      }).catch(function () {});
    }).catch(function (e) { hideLoading(); toast('تعذر تأكيد الأوردر: ' + e.message, true); });
  },
  /* فاتورة */
  printInvoice: function () { window.print(); },
  shareInvoice: function () {
    var inv = UI.invoice; if (!inv) return;
    var o = inv.order, st = settings();
    var text = 'فاتورة مبيعات ' + invoiceNo(o) + ' — ' + st.factoryName + '\n' +
      'العميل: ' + o.customer + '\n' +
      'التاريخ: ' + (o.date || '') + ' • الدفع: ' + (o.method || '—') + '\n' +
      '------------------------\n' +
      inv.lines.map(function (l, i) { return (i + 1) + '. ' + l.item + ' — ' + fmtDoz(l.dozens) + ' دستة (' + fmtNum(l.pairs) + ' زوج) = ' + fmtMoney(l.total); }).join('\n') +
      '\n------------------------\n' +
      'المجموع الفرعي: ' + fmtMoney(o.subtotal) + '\n' +
      'الشحن: ' + fmtMoney(o.shipping) + ' • الخصم: ' + fmtMoney(o.discount) + '\n' +
      'الإجمالي: ' + fmtMoney(o.total) + '\n' +
      'إجمالي الأزواج: ' + fmtNum(o.pairs) + ' زوج\n' +
      'العربون: ' + fmtMoney(o.deposit) + ' • المتبقي: ' + fmtMoney(o.remaining);
    if (navigator.share) {
      navigator.share({ title: 'فاتورة ' + invoiceNo(o), text: text }).catch(function () {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('اتنسخ نص الفاتورة — الصقه في واتساب أو أي مكان.'); })
        .catch(function () { App.showShareText(text); });
    } else App.showShareText(text);
  },
  showShareText: function (text) {
    openModal('<h2>نص الفاتورة</h2><p class="muted small">انسخ النص ده والصقه في واتساب:</p>' +
      '<textarea readonly style="min-height:220px" onclick="this.select()">' + esc(text) + '</textarea>' +
      '<div class="modal-actions"><button class="btn btn-pri btn-block" onclick="closeModal()">تمام</button></div>');
  },
  /* صرف */
  setDisbFilter: function (f) { UI.disbFilter = f; render(); }
};

/* ---------------- التشغيل ---------------- */
document.querySelectorAll('#bottomNav button').forEach(function (b) {
  b.addEventListener('click', function () { go(b.getAttribute('data-nav')); });
});
$('btnRefresh').addEventListener('click', function () { refresh({}).catch(function () {}); });
$('btnSettings').addEventListener('click', function () { go('settings'); });
window.addEventListener('online', function () { updateHeaderStatus(true); refresh({ spinner: false }).catch(function () {}); });
window.addEventListener('offline', function () { updateHeaderStatus(false); toast('النت مقطوع — التطبيق هيحاول تاني لما النت يرجع.', true); });

// تحديث تلقائي كل 25 ثانية — بس لما الصفحة ظاهرة ومفيش نموذج مفتوح ولا كتابة شغالة.
setInterval(function () {
  if (!configured() || document.hidden || modalOpen || refreshing) return;
  if (UI.screen === 'orderNew' || UI.screen === 'invoice') return;
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
  refresh({ spinner: false, toastOnError: false }).catch(function () {});
}, 25000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* PWA اختياري — التطبيق بيشتغل من غيره */ });
  });
}

if (!configured()) { go('setup'); }
else { refresh({ loadingText: 'جارٍ تحميل بيانات المصنع...', toastOnError: false }).catch(function () {}); }
</script>
</body>
</html>
